name: shop_management_app
description: Offline stock & billing manager for a stationary shop (Windows desktop).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline-first)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24   # bundles native sqlite3 for Windows
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.1.2

  # Export bills as PDF (Phase 3)
  pdf: ^3.11.0
  printing: ^5.13.1

  # Export reports as Excel (Phase 3)
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
